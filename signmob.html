<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Mafia Signup</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <style>
    :root { color-scheme: dark light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #050608;
      color: #f8f9fa;
    }
    .app {
      max-width: 600px;
      margin: 0 auto;
      padding: 16px 12px 32px;
    }
    header {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 20px;
      margin: 0;
    }
    .subtitle {
      font-size: 14px;
      color: #a0a4ab;
    }
    .date-row {
      margin-top: 4px;
    }
    .date-row label {
      font-size: 13px;
      display: block;
      margin-bottom: 4px;
    }
    .date-controls {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .date-controls input[type="date"] {
      flex: 1;
      padding: 8px 10px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: rgba(0, 0, 0, 0.4);
      color: inherit;
      font-size: 14px;
      -webkit-appearance: none;
    }
    .pill-btn {
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.8);
      background: rgba(15, 23, 42, 0.9);
      color: #e5e7eb;
      padding: 7px 10px;
      font-size: 12px;
      white-space: nowrap;
      -webkit-tap-highlight-color: transparent;
    }
    .pill-btn:active {
      transform: translateY(1px);
    }

    .card {
      background: rgba(255, 255, 255, 0.04);
      border-radius: 16px;
      padding: 10px 12px;
      margin-bottom: 12px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
    }

    label {
      font-size: 13px;
      display: block;
      margin-bottom: 4px;
    }
    input[type="text"],
    input[type="number"],
    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(0, 0, 0, 0.4);
      color: inherit;
      font-size: 16px;
      -webkit-appearance: none;
    }
    input::placeholder {
      color: #8c8f96;
    }
    input:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 1px #3b82f6;
    }
    button {
      -webkit-tap-highlight-color: transparent;
      cursor: pointer;
    }
    .primary-btn {
      width: 100%;
      margin-top: 8px;
      padding: 11px 14px;
      border-radius: 999px;
      border: none;
      font-size: 16px;
      font-weight: 600;
      background: linear-gradient(135deg, #3b82f6, #06b6d4);
      color: white;
      box-shadow: 0 10px 20px rgba(15, 23, 42, 0.4);
    }
    .primary-btn:disabled {
      opacity: 0.5;
      box-shadow: none;
    }
    .inline-controls {
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }
    .inline-controls button {
      padding-inline: 16px;
      border-radius: 999px;
      border: none;
      font-size: 14px;
      font-weight: 600;
      background: #111827;
      color: #e5e7eb;
      box-shadow: 0 5px 12px rgba(15, 23, 42, 0.6);
      white-space: nowrap;
    }
    .inline-controls button:disabled {
      opacity: 0.5;
      box-shadow: none;
    }
    .suggestions {
      position: relative;
      margin-top: 4px;
    }
    .suggestions-list {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      max-height: 260px;
      overflow-y: auto;
      background: #111827;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      z-index: 20;
    }
    .suggestion-item {
      padding: 10px 12px;
      font-size: 15px;
    }
    .suggestion-item + .suggestion-item {
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }
    .suggestion-item:active,
    .suggestion-item:hover {
      background: #1f2937;
    }
    .chips {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
      font-size: 13px;
      color: #9ca3af;
    }
    .chips strong {
      font-size: 14px;
      color: #e5e7eb;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    thead th {
      text-align: left;
      padding: 6px 4px;
      font-weight: 500;
      color: #9ca3af;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
    }
    tbody td {
      padding: 8px 4px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }
    tbody tr:last-child td {
      border-bottom: none;
    }
    .col-num {
      width: 32px;
      text-align: right;
    }
    .col-check {
      width: 64px;
      text-align: center;
    }
    .col-del {
      width: 40px;
      text-align: center;
    }
    tbody tr.filled {
      color: #f9fafb;
    }
    tbody tr.empty {
      color: #4b5563;
      font-style: italic;
    }
    .status-paid {
      color: #22c55e;
      font-weight: 500;
    }
    .status-unpaid {
      color: #f97316;
    }
    .status-mvp {
      color: #facc15;
      font-weight: 600;
    }
    .error {
      margin-top: 8px;
      font-size: 13px;
      color: #fb7185;
    }
    .small-note {
      margin-top: 8px;
      font-size: 12px;
      color: #6b7280;
    }
    input[type="checkbox"] {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      appearance: none;
      -webkit-appearance: none;
      background: rgba(0, 0, 0, 0.4);
      position: relative;
    }
    input[type="checkbox"]:checked::after {
      content: "✓";
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }

    /* AUTH */
    .auth-card {
      padding: 6px 10px;
    }
    .auth-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      cursor: pointer;
    }
    .auth-status {
      font-weight: 600;
    }
    .auth-status.readonly {
      color: #f97316;
    }
    .auth-status.editable {
      color: #22c55e;
    }
    .auth-small {
      font-size: 12px;
      color: #9ca3af;
    }
    .auth-user {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 6px;
      font-size: 13px;
    }
    .auth-user-email {
      max-width: 70%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .auth-logout-btn {
      border-radius: 999px;
      border: none;
      padding: 6px 10px;
      font-size: 12px;
      background: #111827;
      color: #e5e7eb;
    }

    /* Players manage */
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }
    .section-title {
      font-size: 14px;
      font-weight: 500;
    }
    .section-toggle {
      font-size: 12px;
      color: #9ca3af;
    }
    .player-manage-list {
      margin-top: 8px;
      max-height: 260px;
      overflow-y: auto;
    }
    .player-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      border-bottom: 1px solid rgba(31, 41, 55, 0.7);
    }
    .player-row:last-child {
      border-bottom: none;
    }
    .player-name {
      font-size: 14px;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .player-actions {
      display: flex;
      gap: 6px;
      margin-left: 6px;
    }
    .small-btn {
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.6);
      background: #020617;
      color: #e5e7eb;
      font-size: 11px;
      padding: 4px 8px;
      white-space: nowrap;
    }
    .small-btn.danger {
      border-color: rgba(248, 113, 113, 0.9);
      color: #fecaca;
    }
    .inline-add-player {
      display: flex;
      gap: 6px;
      margin-top: 6px;
    }
    .inline-add-player input {
      flex: 1;
      font-size: 14px;
      padding: 8px 10px;
    }
    .inline-add-player button {
      font-size: 13px;
      padding: 8px 12px;
    }

    .delete-btn {
      background: none;
      border: none;
      padding: 4px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      line-height: 1;
      color: #fca5a5;
    }
    .delete-btn:disabled {
      opacity: 0.3;
      cursor: default;
    }
    .delete-btn:not(:disabled):active {
      background: rgba(127, 29, 29, 0.6);
    }

    @media (min-width: 480px) {
      .app {
        padding-inline: 20px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>

      <div class="date-row">

        <div class="date-controls">
          <input id="gameDateInput" type="date" />
          <button type="button" class="pill-btn" id="nearestThuBtn">Четверг</button>
          <button type="button" class="pill-btn" id="nearestSunBtn">Воскресенье</button>
        </div>
      </div>
    </header>

    <!-- Авторизация -->
    <section class="card auth-card">
      <div class="auth-header" id="authHeader">
        <div id="authStatus" class="auth-status readonly">Не авторизовано</div>
        <div id="authHint" class="auth-small">Развернуть</div>
      </div>

      <div id="authBody" style="display:none; margin-top:8px;">
        <div id="authForm">
          <label for="authEmail">E-mail</label>
          <input id="authEmail" type="email" autocomplete="email" placeholder="you@example.com" />

          <label for="authPassword">Пароль</label>
          <input id="authPassword" type="password" autocomplete="current-password" placeholder="Пароль" />

          <button id="authLoginBtn" class="primary-btn" type="button">Войти</button>
          <div id="authError" class="error" style="display:none;"></div>
        </div>

        <div id="authUserInfo" class="auth-user" style="display:none;">
          <div>
            <div class="auth-small">Вы вошли как</div>
            <div id="authUserEmail" class="auth-user-email"></div>
          </div>
          <button id="authLogoutBtn" class="auth-logout-btn" type="button">Выйти</button>
        </div>
      </div>
    </section>

    <!-- Выбор игрока -->
    <section class="card">
      <input id="playerSearch" type="text" autocomplete="off" placeholder="Начни вводить имя..." />
      <div class="suggestions">
        <div id="playerSuggestions" class="suggestions-list" style="display: none;"></div>
      </div>
      <div class="chips">
        <span>Всего игроков в базе: <strong id="playersCount">0</strong></span>
        <span>Уже записано: <strong id="signedCount">0</strong>/<span id="tableSize">14</span></span>
      </div>
      <button id="addPlayerBtn" class="primary-btn" type="button" disabled>Добавить</button>
      <div class="error" id="addError" style="display: none;"></div>
    </section>

    <!-- Таблица -->
    <section class="card">
      <table>
        <thead>
          <tr>
            <th class="col-num">№</th>
            <th>Имя</th>
            <th>Статус</th>
            <th class="col-check">Опл.</th>
            <th class="col-del"></th>
          </tr>
        </thead>
        <tbody id="signupTableBody">
        </tbody>
      </table>
    </section>

    <!-- Размер стола в самом низу -->
    <section class="card">
      <div class="inline-controls">
        <div style="flex: 1;">
          <label for="sizeInput">Размер стола (кол-во мест)</label>
          <input id="sizeInput" type="number" min="1" max="20" />
        </div>
        <button id="saveSizeBtn" type="button">Сохранить</button>
      </div>

    </section>

    <!-- Управление игроками -->
    <section class="card">
      <div class="section-header" id="playersManageHeader">
        <div class="section-title">Управление списком игроков</div>
        <div id="playersManageToggleLabel" class="section-toggle">Показать</div>
      </div>
      <div id="playersManageBody" style="display:none; margin-top:8px;">
        <label for="newPlayerName">Добавить нового игрока</label>
        <div class="inline-add-player">
          <input id="newPlayerName" type="text" placeholder="Имя и фамилия" />
          <button id="addNewPlayerBtn" type="button" class="small-btn">Добавить</button>
        </div>


        <div id="playersManageList" class="player-manage-list"></div>
      </div>
    </section>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-app.js";
    import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-database.js";
    import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA21AZnchKpt5TvwFSvBKXrCeYzAi4nzUM",
      authDomain: "mafiakato.firebaseapp.com",
      databaseURL: "https://mafiakato-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "mafiakato",
      storageBucket: "mafiakato.firebasestorage.app",
      messagingSenderId: "739353653752",
      appId: "1:739353653752:web:fb7497e2135736c43b260d"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);

    const stateRef = ref(db, "words/state");
    // === Список игроков: используем тот же источник, что и pc.html (words/state -> players[]) ===

    function touchStateMeta(updates){
      // Делает изменения заметными для pc.html, который фильтрует live-обновления по meta.lastUpdatedAt
      updates["words/state/meta/lastUpdatedAt"] = Date.now();
    }


    const gameDateInput = document.getElementById("gameDateInput");
    const nearestThuBtn = document.getElementById("nearestThuBtn");
    const nearestSunBtn = document.getElementById("nearestSunBtn");

    const playersCountEl = document.getElementById("playersCount");
    const signedCountEl = document.getElementById("signedCount");
    const tableSizeEl = document.getElementById("tableSize");
    const tableBodyEl = document.getElementById("signupTableBody");
    const sizeInputEl = document.getElementById("sizeInput");
    const saveSizeBtn = document.getElementById("saveSizeBtn");

    const playerSearchInput = document.getElementById("playerSearch");
    const suggestionsContainer = document.getElementById("playerSuggestions");
    const addPlayerBtn = document.getElementById("addPlayerBtn");
    const addErrorEl = document.getElementById("addError");

    // Auth DOM
    const authHeaderEl = document.getElementById("authHeader");
    const authStatusEl = document.getElementById("authStatus");
    const authHintEl = document.getElementById("authHint");
    const authBodyEl = document.getElementById("authBody");
    const authFormEl = document.getElementById("authForm");
    const authUserInfoEl = document.getElementById("authUserInfo");
    const authUserEmailEl = document.getElementById("authUserEmail");
    const authEmailInput = document.getElementById("authEmail");
    const authPasswordInput = document.getElementById("authPassword");
    const authLoginBtn = document.getElementById("authLoginBtn");
    const authLogoutBtn = document.getElementById("authLogoutBtn");
    const authErrorEl = document.getElementById("authError");

    // Players manage DOM
    const playersManageHeaderEl = document.getElementById("playersManageHeader");
    const playersManageToggleLabelEl = document.getElementById("playersManageToggleLabel");
    const playersManageBodyEl = document.getElementById("playersManageBody");
    const newPlayerNameInput = document.getElementById("newPlayerName");
    const addNewPlayerBtn = document.getElementById("addNewPlayerBtn");
    const playersManageListEl = document.getElementById("playersManageList");

    let state = null;
    let allPlayers = [];
    let playersById = {};
    let currentDate = null;
    let currentSignups = null;
    let user = null; // Firebase user
    let userSelectedDate = false;
    let authExpanded = false;
    let playersManageExpanded = false;

    function formatDateYmd(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    // Всегда стартуем с сегодняшней даты
    // Автоматически выбираем ближайший игровой день:
// - если сегодня ПН(1)–ЧТ(4) → ближайший четверг
// - если ПТ(5)–ВС(0) → ближайшее воскресенье
function determineCurrentDate() {
  const today = new Date();
  const dow = today.getDay(); // 0 = Sunday, 1 = Monday, ..., 6 = Saturday

  let targetDow;

  // Понедельник(1), Вторник(2), Среда(3), Четверг(4)
  if (dow >= 1 && dow <= 4) {
    targetDow = 4; // Четверг
  } else {
    targetDow = 0; // Воскресенье
  }

  let diff = (targetDow - dow + 7) % 7;
  const result = new Date(today);
  result.setDate(today.getDate() + diff);

  return formatDateYmd(result);
}


    function rebuildPlayers(source) {
      const list = Array.isArray(source) ? source : ((source && source.players) ? source.players : []);
      allPlayers = list.slice().sort((a, b) => a.name.localeCompare(b.name, "ru"));
      playersById = {};
      for (const p of allPlayers) {
        playersById[p.id] = p;
      }
      playersCountEl.textContent = String(allPlayers.length);
      renderPlayersManage();
    }

    function renderSignups() {
      if (!state) return;

      const signupsAll = state.signups || {};
      currentSignups = signupsAll[currentDate] || {};
      const entries = currentSignups.entries || [];
      const size = currentSignups.size != null ? currentSignups.size : 14;

      gameDateInput.value = currentDate;
      signedCountEl.textContent = String(entries.length);
      tableSizeEl.textContent = String(size);
      sizeInputEl.value = String(size);

      tableBodyEl.innerHTML = "";

      for (let i = 0; i < size; i++) {
        const tr = document.createElement("tr");
        const numTd = document.createElement("td");
        numTd.className = "col-num";
        numTd.textContent = String(i + 1);
        tr.appendChild(numTd);

        const nameTd = document.createElement("td");
        const statusTd = document.createElement("td");
        const paidTd = document.createElement("td");
        paidTd.className = "col-check";
        const delTd = document.createElement("td");
        delTd.className = "col-del";

        const entry = entries[i];

        const createDeleteButton = () => {
          const delBtn = document.createElement("button");
          delBtn.type = "button";
          delBtn.className = "delete-btn";
          delBtn.innerText = "🗑";
          if (!entry || !user) {
            delBtn.disabled = !entry || !user;
          }
          delBtn.addEventListener("click", () => {
            if (!entry) return;
            if (!user) {
              alert("Только чтение. Войдите, чтобы удалять игроков из списка.");
              return;
            }
            const player = entry.playerId && playersById[entry.playerId];
            const name = player ? player.name : `#${entry.playerId || ""}`;
            const confirmText = `Удалить запись игрока "${name}" из состава на ${currentDate}?`;
            if (!confirm(confirmText)) return;

            const signupsAllNow = (state && state.signups) || {};
            const signupsForDateNow = signupsAllNow[currentDate] || {};
            const entriesNow = (signupsForDateNow.entries || []).slice();
            const entryAtIndex = entriesNow[i];
            if (!entryAtIndex) {
              return;
            }

            const updates = {};

            // Если был MVP и есть _mvpRemovedRecords — вернём удалённые записи в mvpDays
            if (entryAtIndex.mvp && Array.isArray(entryAtIndex._mvpRemovedRecords)) {
              const currentMvpDays = (state && state.mvpDays) || [];
              const newMvpDays = currentMvpDays.slice();

              entryAtIndex._mvpRemovedRecords.forEach((rec) => {
                const exists = newMvpDays.some(
                  (m) => m.date === rec.date && m.pid === rec.pid && m.ts === rec.ts
                );
                if (!exists) {
                  newMvpDays.push({
                    date: rec.date,
                    pid: rec.pid,
                    ts: rec.ts
                  });
                }
              });

              updates["words/state/mvpDays"] = newMvpDays;
              state.mvpDays = newMvpDays; // локально для мгновенного UI
            }

            // Локально удаляем запись из entries (для мгновенного UI)
            entriesNow.splice(i, 1);
            if (!state.signups) state.signups = {};
            if (!state.signups[currentDate]) state.signups[currentDate] = { ...signupsForDateNow };
            state.signups[currentDate].entries = entriesNow;
            renderSignups();

            updates[`words/state/signups/${currentDate}/entries`] = entriesNow;

            touchStateMeta(updates);

            update(ref(db), updates).catch((err) => {
              console.error("Ошибка удаления записи игрока:", err);
              alert("Не удалось удалить запись. Проверь соединение.");
            });
          });
          delTd.appendChild(delBtn);
        };

        if (entry && playersById[entry.playerId]) {
          const player = playersById[entry.playerId];
          tr.classList.add("filled");
          nameTd.textContent = player.name;

          let statusText = "";
          let statusClass = "";

          if (entry.mvp) {
            statusText = "MVP";
            statusClass = "status-mvp";
          } else if (entry.paid) {
            statusText = "Оплачен";
            statusClass = "status-paid";
          } else {
            statusText = "Не оплачен";
            statusClass = "status-unpaid";
          }

          statusTd.textContent = statusText;
          statusTd.className = statusClass;

          const checkbox = document.createElement("input");
          checkbox.type = "checkbox";
          checkbox.checked = !!entry.paid;
          checkbox.disabled = !user;

          checkbox.addEventListener("change", () => {
            if (!user) {
              checkbox.checked = !checkbox.checked;
              alert("Только чтение. Войдите, чтобы менять оплату.");
              return;
            }
            const updates = {};
            updates[`words/state/signups/${currentDate}/entries/${i}/paid`] = checkbox.checked;

            // локальное обновление для мгновенного UI
            if (state.signups && state.signups[currentDate] && state.signups[currentDate].entries) {
              state.signups[currentDate].entries[i] = {
                ...state.signups[currentDate].entries[i],
                paid: checkbox.checked
              };
            }

            touchStateMeta(updates);

            update(ref(db), updates).catch((err) => {
              console.error(err);
              checkbox.checked = !checkbox.checked;
            });
          });
          paidTd.appendChild(checkbox);

          createDeleteButton();
        } else if (entry) {
          tr.classList.add("filled");
          nameTd.textContent = `#${entry.playerId}`;
          if (entry.paid) {
            statusTd.textContent = "Оплачен (неизвестный игрок)";
            statusTd.className = "status-paid";
          } else {
            statusTd.textContent = "Не оплачен (неизвестный)";
            statusTd.className = "status-unpaid";
          }
          const checkbox = document.createElement("input");
          checkbox.type = "checkbox";
          checkbox.checked = !!entry.paid;
          checkbox.disabled = !user;
          checkbox.addEventListener("change", () => {
            if (!user) {
              checkbox.checked = !checkbox.checked;
              alert("Только чтение. Войдите, чтобы менять оплату.");
              return;
            }
            const updates = {};
            updates[`words/state/signups/${currentDate}/entries/${i}/paid`] = checkbox.checked;

            if (state.signups && state.signups[currentDate] && state.signups[currentDate].entries) {
              state.signups[currentDate].entries[i] = {
                ...state.signups[currentDate].entries[i],
                paid: checkbox.checked
              };
            }

            touchStateMeta(updates);

            update(ref(db), updates).catch((err) => {
              console.error(err);
              checkbox.checked = !checkbox.checked;
            });
          });
          paidTd.appendChild(checkbox);

          createDeleteButton();
        } else {
          tr.classList.add("empty");
          nameTd.textContent = "— свободно —";
          statusTd.textContent = "";
          paidTd.textContent = "";
        }

        tr.appendChild(nameTd);
        tr.appendChild(statusTd);
        tr.appendChild(paidTd);
        tr.appendChild(delTd);
        tableBodyEl.appendChild(tr);
      }

      saveSizeBtn.disabled = !user;
    }

    function renderSuggestions() {
      const query = playerSearchInput.value.trim().toLowerCase();
      const MAX_RESULTS = 20;

      if (!query) {
        suggestionsContainer.style.display = "none";
        suggestionsContainer.innerHTML = "";
        addPlayerBtn.disabled = true;
        playerSearchInput.dataset.selectedPlayerId = "";
        return;
      }

      const matches = allPlayers
        .filter((p) => p.name.toLowerCase().includes(query))
        .slice(0, MAX_RESULTS);
      suggestionsContainer.innerHTML = "";

      if (!matches.length) {
        suggestionsContainer.style.display = "none";
        addPlayerBtn.disabled = true;
        playerSearchInput.dataset.selectedPlayerId = "";
        return;
      }

      suggestionsContainer.style.display = "block";

      for (const p of matches) {
        const div = document.createElement("div");
        div.className = "suggestion-item";
        div.textContent = p.name;
        div.addEventListener("click", () => {
          playerSearchInput.value = p.name;
          playerSearchInput.dataset.selectedPlayerId = p.id;
          suggestionsContainer.style.display = "none";
          suggestionsContainer.innerHTML = "";
          addErrorEl.style.display = "none";
          addPlayerBtn.disabled = !user; // без авторизации не даём добавлять
        });
        suggestionsContainer.appendChild(div);
      }
    }

    // ===== Auth UI =====
    function setAuthExpanded(expanded) {
      authExpanded = expanded;
      authBodyEl.style.display = expanded ? "block" : "none";
      authHintEl.textContent = expanded ? "Свернуть" : "Развернуть";
    }

    function updateAuthUi() {
      if (user) {
        authStatusEl.textContent = "Авторизовано";
        authStatusEl.classList.remove("readonly");
        authStatusEl.classList.add("editable");
        authFormEl.style.display = "none";
        authUserInfoEl.style.display = "flex";
        authUserEmailEl.textContent = user.email || "(без e-mail)";
        authErrorEl.style.display = "none";
      } else {
        authStatusEl.textContent = "Не авторизовано";
        authStatusEl.classList.remove("editable");
        authStatusEl.classList.add("readonly");
        authFormEl.style.display = "block";
        authUserInfoEl.style.display = "none";
        addPlayerBtn.disabled = true;
        saveSizeBtn.disabled = true;
      }
      renderSignups();
      renderPlayersManage();
    }

    onAuthStateChanged(auth, (u) => {
      user = u;
      updateAuthUi();
    });

    authHeaderEl.addEventListener("click", () => {
      setAuthExpanded(!authExpanded);
    });

    authLoginBtn.addEventListener("click", () => {
      const email = authEmailInput.value.trim();
      const password = authPasswordInput.value;

      if (!email || !password) {
        authErrorEl.textContent = "Введи e-mail и пароль.";
        authErrorEl.style.display = "block";
        return;
      }

      authErrorEl.style.display = "none";

      signInWithEmailAndPassword(auth, email, password)
        .then(() => {
          authEmailInput.value = "";
          authPasswordInput.value = "";
        })
        .catch((err) => {
          console.error("Login error", err);
          authErrorEl.textContent = "Ошибка входа: " + (err.code || "проверь данные");
          authErrorEl.style.display = "block";
        });
    });

    authLogoutBtn.addEventListener("click", () => {
      signOut(auth).catch((err) => console.error("Logout error", err));
    });

    // ===== Players manage UI =====
    function setPlayersManageExpanded(expanded) {
      playersManageExpanded = expanded;
      playersManageBodyEl.style.display = expanded ? "block" : "none";
      playersManageToggleLabelEl.textContent = expanded ? "Скрыть" : "Показать";
    }

    playersManageHeaderEl.addEventListener("click", () => {
      setPlayersManageExpanded(!playersManageExpanded);
    });

    function renderPlayersManage() {
      playersManageListEl.innerHTML = "";
      const list = allPlayers;

      if (!list.length) {
        const empty = document.createElement("div");
        empty.className = "small-note";
        empty.textContent = "Пока нет ни одного игрока в базе.";
        playersManageListEl.appendChild(empty);
        return;
      }

      list.forEach((p) => {
        const row = document.createElement("div");
        row.className = "player-row";

        const nameEl = document.createElement("div");
        nameEl.className = "player-name";
        nameEl.textContent = p.name;

        const actions = document.createElement("div");
        actions.className = "player-actions";

        const editBtn = document.createElement("button");
        editBtn.type = "button";
        editBtn.className = "small-btn";
        editBtn.textContent = "Редакт.";
        editBtn.disabled = !user;

        editBtn.addEventListener("click", () => {
          if (!user) {
            alert("Только чтение. Войдите, чтобы редактировать игроков.");
            return;
          }
          const currentName = p.name || "";
          const newName = prompt("Новое имя игрока:", currentName);
          if (newName === null) return;
          const trimmed = newName.trim();
          if (!trimmed) return;

          // локальное обновление (для мгновенного UI)
try {
  const pid = p.id;
  const local = (allPlayers || []).map((pp) => (pp.id === pid ? { ...pp, name: trimmed } : pp));
  rebuildPlayers(local);
  renderSignups();
} catch (_) {}

// сохраним в Firebase в том же месте, что использует pc.html
const base = (state && Array.isArray(state.players)) ? state.players : (allPlayers || []);
const nextPlayers = base.map((pp) => (pp && pp.id === p.id ? { ...pp, name: trimmed, updatedAt: Date.now() } : pp));

if (!state) state = {};
state.players = nextPlayers;
rebuildPlayers(nextPlayers);
renderSignups();

const updates = {};
updates["words/state/players"] = nextPlayers;
touchStateMeta(updates);

update(ref(db), updates).catch((err) => {
  console.error("Ошибка обновления игрока:", err);
  alert("Не удалось обновить имя игрока.");
});
        });

        const deleteBtn = document.createElement("button");
        deleteBtn.type = "button";
        deleteBtn.className = "small-btn danger";
        deleteBtn.textContent = "Удалить";
        deleteBtn.disabled = !user;

        deleteBtn.addEventListener("click", () => {
          if (!user) {
            alert("Только чтение. Войдите, чтобы удалять игроков.");
            return;
          }
          const confirmText = `Удалить игрока "${p.name}" из базы? Его записи в старых играх останутся, но будут отображаться как неизвестный игрок.`;
          if (!confirm(confirmText)) return;

          // локальное обновление (для мгновенного UI)
try {
  const local = (allPlayers || []).filter((pp) => pp.id !== p.id);
  rebuildPlayers(local);
  renderSignups();
} catch (_) {}

// удаляем из общего списка players (words/state/players)
const base = (state && Array.isArray(state.players)) ? state.players : (allPlayers || []);
const nextPlayers = base.filter((pp) => pp && pp.id !== p.id);

if (!state) state = {};
state.players = nextPlayers;
rebuildPlayers(nextPlayers);
renderSignups();

const updates = {};
updates["words/state/players"] = nextPlayers;
touchStateMeta(updates);

update(ref(db), updates).catch((err) => {
  console.error("Ошибка удаления игрока:", err);
  alert("Не удалось удалить игрока.");
});
        });

        actions.appendChild(editBtn);
        actions.appendChild(deleteBtn);

        row.appendChild(nameEl);
        row.appendChild(actions);
        playersManageListEl.appendChild(row);
      });
    }

    addNewPlayerBtn.addEventListener("click", () => {
      if (!user) {
        alert("Только чтение. Войдите, чтобы добавлять игроков.");
        return;
      }
      const raw = newPlayerNameInput.value.trim();
      if (!raw) {
        alert("Введи имя игрока.");
        return;
      }

      const listNow = (allPlayers || []);
// проверим, нет ли игрока с таким же именем
const existsByName = listNow.some((p) => String(p.name || "").toLowerCase() === raw.toLowerCase());
if (existsByName) {
  if (!confirm("Игрок с таким же именем уже есть. Всё равно добавить ещё одного?")) {
    return;
  }
}

const now = Date.now();
      // Генерим id в том же стиле, что и pc.html (короткий random base36)
      const id = (Math.random().toString(36).slice(2,10) + Math.random().toString(36).slice(2,6));

      const newPlayer = {
        id,
        name: raw,
        rating: 0,
        stats: { games: 0, wins: 0 },
        createdAt: now
      };

      const nextPlayers = ((state && Array.isArray(state.players)) ? state.players.slice() : (allPlayers || []).slice());
      nextPlayers.push(newPlayer);

      // локально обновим UI мгновенно
      if (!state) state = {};
      state.players = nextPlayers;
      rebuildPlayers(nextPlayers);
      renderSignups();

      const updates = {};
      updates["words/state/players"] = nextPlayers;
      touchStateMeta(updates);

      update(ref(db), updates)
        .then(() => {
          newPlayerNameInput.value = "";
        })
        .catch((err) => {
          console.error("Ошибка добавления игрока:", err);
          alert("Не удалось добавить игрока.");
        });
    });

    // ===== Handlers =====
    playerSearchInput.addEventListener("input", () => {
      addErrorEl.style.display = "none";
      renderSuggestions();
    });

    playerSearchInput.addEventListener("focus", () => {
      renderSuggestions();
    });

    document.addEventListener("click", (evt) => {
      if (!suggestionsContainer.contains(evt.target) && evt.target !== playerSearchInput) {
        suggestionsContainer.style.display = "none";
      }
    });

    addPlayerBtn.addEventListener("click", () => {
      if (!user) {
        alert("Только чтение. Войдите, чтобы добавлять игроков.");
        return;
      }

      const playerId = playerSearchInput.dataset.selectedPlayerId;
      if (!playerId) {
        addErrorEl.textContent = "Сначала выбери игрока из списка.";
        addErrorEl.style.display = "block";
        return;
      }

      const signupsAll = (state && state.signups) || {};
      const signupsForDate = signupsAll[currentDate] || {};
      const entries = signupsForDate.entries || [];
      const size = signupsForDate.size != null ? signupsForDate.size : 14;

      if (entries.some((e) => e && e.playerId === playerId)) {
        addErrorEl.textContent = "Этот игрок уже записан на игру.";
        addErrorEl.style.display = "block";
        return;
      }

      if (entries.length >= size) {
        addErrorEl.textContent = "Все места заняты. Увеличь размер стола, если нужно больше игроков.";
        addErrorEl.style.display = "block";
        return;
      }

      const newIndex = entries.length;
      const now = Date.now();

      const updates = {};
      const newEntry = {
        paid: true,
        playerId: playerId,
        ts: now
      };

      // Проверяем, есть ли у игрока "висящий" MVP в mvpDays
      const allMvpDays = (state && state.mvpDays) ? state.mvpDays.slice() : [];
      const mvpIdx = allMvpDays.findIndex((m) => m && m.pid === playerId);
      if (mvpIdx !== -1) {
        const usedRec = allMvpDays.splice(mvpIdx, 1)[0];
        newEntry.mvp = true;
        newEntry._mvpRemovedRecords = [usedRec];
        updates["words/state/mvpDays"] = allMvpDays;
        state.mvpDays = allMvpDays; // локально обновим, чтобы сразу исчезло из списка MVP в основном приложении при следующем чтении
      }

      updates[`words/state/signups/${currentDate}/entries/${newIndex}`] = newEntry;
      if (signupsForDate.size == null) {
        updates[`words/state/signups/${currentDate}/size`] = size;
      }

      // локальное обновление для мгновенного UI
      if (!state.signups) state.signups = {};
      const signupsForDateLocal = state.signups[currentDate] || { entries: [], size };
      const entriesLocal = (signupsForDateLocal.entries || []).slice();
      entriesLocal.push(newEntry);
      signupsForDateLocal.entries = entriesLocal;
      if (signupsForDateLocal.size == null) signupsForDateLocal.size = size;
      state.signups[currentDate] = signupsForDateLocal;
      renderSignups();

      touchStateMeta(updates);

      update(ref(db), updates)
        .then(() => {
          playerSearchInput.value = "";
          playerSearchInput.dataset.selectedPlayerId = "";
          suggestionsContainer.style.display = "none";
          suggestionsContainer.innerHTML = "";
          addPlayerBtn.disabled = true;
          addErrorEl.style.display = "none";
        })
        .catch((err) => {
          console.error(err);
          addErrorEl.textContent = "Не удалось записать игрока. Проверь интернет и повтори.";
          addErrorEl.style.display = "block";
        });
    });

    saveSizeBtn.addEventListener("click", () => {
      if (!user) {
        alert("Только чтение. Войдите, чтобы менять размер стола.");
        return;
      }
      const raw = sizeInputEl.value.trim();
      let size = parseInt(raw, 10);
      if (!Number.isFinite(size) || size <= 0) {
        size = 14;
      }
      if (size > 20) size = 20;

      const path = `words/state/signups/${currentDate}/size`;
      const updates = {};
      updates[path] = size;

      // локальное обновление
      if (!state.signups) state.signups = {};
      if (!state.signups[currentDate]) state.signups[currentDate] = { entries: [] };
      state.signups[currentDate].size = size;
      renderSignups();

      touchStateMeta(updates);

      update(ref(db), updates).catch((err) => {
        console.error(err);
      });
    });

    // ===== Date controls =====
    function setDateAndRender(newDate, explicit = false) {
      currentDate = newDate;
      if (explicit) {
        userSelectedDate = true;
      }
      renderSignups();
    }

    gameDateInput.addEventListener("change", () => {
      if (!gameDateInput.value) return;
      setDateAndRender(gameDateInput.value, true);
    });

    function nearestDayOfWeek(targetDow) {
      const today = new Date();
      const currentDow = today.getDay(); // 0=Sun .. 6=Sat
      let diff = (targetDow - currentDow + 7) % 7; // ближайший, включая сегодня
      const result = new Date(today);
      result.setDate(today.getDate() + diff);
      return formatDateYmd(result);
    }

    nearestThuBtn.addEventListener("click", () => {
      const d = nearestDayOfWeek(4); // Thursday
      gameDateInput.value = d;
      setDateAndRender(d, true);
    });

    nearestSunBtn.addEventListener("click", () => {
      const d = nearestDayOfWeek(0); // Sunday
      gameDateInput.value = d;
      setDateAndRender(d, true);
    });

// ===== Firebase state subscription =====
    onValue(
      stateRef,
      (snap) => {
        const newState = snap.val() || {};
        state = newState;

        if (!currentDate || !userSelectedDate) {
          currentDate = determineCurrentDate();
        }
        rebuildPlayers(newState);
        renderSignups();
      },
      (error) => {
        console.error("Ошибка чтения Firebase:", error);
      }
    );

    // Стартовые значения
    currentDate = determineCurrentDate();
    gameDateInput.value = currentDate;
    setAuthExpanded(false);
    setPlayersManageExpanded(false);
  </script>
</body>
</html>
